<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Confirm your new sign-in email · MyEden Group CMS</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <!-- PRI-029: the one-time link from "Confirm your new MyEden CMS sign-in email". Nothing changes until the button is pressed. -->
  <style>
    :root { --bg: #f4f6fb; --card: #fff; --ink: #1f2937; --muted: #6b7280; --navy: #1B2A6B; --blue: #0072bc; --ok: #067647; --err: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #111c33; --ink: #e5e7eb; --muted: #9ca3af; --navy: #c7d2fe; --blue: #3aa0ff; --ok: #4ade80; --err: #f87171; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
    .card { background: var(--card); border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); max-width: 440px; width: 100%; padding: 28px; }
    h1 { font-size: 20px; color: var(--navy); margin: 0 0 6px; }
    .brand { font-weight: 700; color: var(--blue); font-size: 14px; letter-spacing: .02em; margin-bottom: 14px; }
    p { margin: 10px 0; }
    .muted { color: var(--muted); font-size: 14px; }
    button, a.btn { display: inline-block; background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 700;
      cursor: pointer; text-decoration: none; margin-top: 10px; }
    button[disabled] { opacity: .6; cursor: default; }
    .ok { color: var(--ok); font-weight: 700; }
    .err { color: var(--err); font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">MyEden Group CMS</div>
    <h1>Confirm your new sign-in email</h1>
    <div id="box">
      <p>Press the button to confirm that this email is yours. Your CMS sign-in then changes to it.</p>
      <button type="button" id="go">Confirm my new email</button>
      <p class="muted">You keep your password. If you did not expect this, close this page and tell HR.</p>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script>
    (function () {
      var box = document.getElementById('box');
      var t = new URLSearchParams(location.search).get('t');
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      if (!t) { box.innerHTML = '<p class="err">This link is incomplete.</p><p class="muted">Open the button in the email again, or ask HR to send a new one.</p>'; return; }
      document.getElementById('go').addEventListener('click', async function () {
        var b = this; b.disabled = true; b.textContent = 'Confirming…';
        try {
          var C = window.CMS_CONFIG;
          var r = await fetch(C.url + '/functions/v1/cms-login-email', {
            method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.key },
            body: JSON.stringify({ action: 'confirm', token: t }),
          });
          var d = {}; try { d = await r.json(); } catch (x) { /* keep empty */ }
          if (!r.ok || !d.ok) throw new Error(d.error || 'Something went wrong. Please try again or tell HR.');
          box.innerHTML = '<p class="ok">Done. You now sign in with ' + esc(d.email) + '.</p><p class="muted">Use the same password as before.</p><a class="btn" href="./">Open the MyEden CMS</a>';
          history.replaceState(null, '', location.pathname);
        } catch (e) {
          box.innerHTML = '<p class="err">' + esc(e.message) + '</p><p class="muted">If you need a new link, ask HR.</p>';
        }
      });
    })();
  </script>
</body>
</html>

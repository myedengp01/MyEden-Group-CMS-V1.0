<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyEden Group CMS V1.0</title>
  <meta name="description" content="MyEden Group Central Management System: people, recruitment, payroll, forms and claims in one place.">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0072bc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyEden CMS">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" id="cms-css" href="../css/cms.css">
  <script>
    window.CMS_ROOT = '../';   // files live one folder up; this page is the installable app
    // set the theme before first paint (no flash)
    try { var t = JSON.parse(localStorage.getItem('cms.theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <noscript>MyEden Group CMS needs JavaScript switched on.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script>
    // Always run the latest release: ask the server for the current version (never from cache),
    // then load the app files tagged with that version so the browser cannot reuse an older copy.
    (function () {
      var files = ['version', 'config', 'api', 'icons', 'menu', 'claim-pdf', 'app'];
      function load(v) {
        var css = document.getElementById('cms-css'); if (css) css.href = '../css/cms.css?v=' + v;
        files.forEach(function (f) { var s = document.createElement('script'); s.src = '../js/' + f + '.js?v=' + v; s.async = false; document.body.appendChild(s); });
      }
      fetch('../js/version.js?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (t) { var m = t.match(/CMS_VERSION\s*=\s*'([^']+)'/); load(encodeURIComponent(m ? m[1] : Date.now())); })
        .catch(function () { load(Date.now()); });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Employee Handbook · MyEden Group CMS</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0f172a;--brand:#0f766e;--brand2:#0891b2;--ink:#172033;--muted:#64748b;--line:#d8dee8;--bg:#f3f6fa;--card:#fff;--done:#f1f5f9}
html,body{margin:0;height:100%;font-family:Arial,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg)}
.top{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brandbox img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:7px;padding:3px}
.brandname{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandsub{font-size:10px;color:#cbd5e1;margin-top:2px}
.top button,.top a{border:0;border-radius:6px;padding:8px 11px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.btn-white{background:#fff;color:#111827}.btn-blue{background:#2563eb;color:#fff}.btn-green{background:#0f766e;color:#fff}
.top .admin-only{display:none}.top.is-admin .admin-only{display:inline-block}
.layout{max-width:1550px;margin:0 auto;padding:14px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;height:calc(100vh - 68px)}
.sidebar{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.employee-card{flex:0 0 auto;padding:13px}.progress-card{flex:0 0 auto;padding:13px;max-height:42vh;overflow:auto}
.nav-card{flex:1 1 260px;min-height:220px;padding:12px;display:flex;flex-direction:column}
.nav-scroll{overflow:auto;min-height:0;padding-right:4px}
.meta-title{font-weight:900;font-size:14px;margin-bottom:7px}.meta-row{font-size:11px;line-height:1.45;margin:3px 0;color:#475569}.meta-row b{color:#172033}
.status{display:inline-block;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900;text-transform:uppercase}.s-assigned{background:#eef2ff;color:#4338ca}.s-viewed{background:#e0f2fe;color:#075985}.s-read{background:#fef3c7;color:#92400e}.s-acknowledged{background:#dcfce7;color:#166534}
.progress-bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:8px 0 5px}.progress-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#14b8a6);width:0}
.progress-big{font-size:22px;font-weight:900;color:#0f766e}.progress-note{font-size:10px;color:#64748b;line-height:1.4}
.mark-read{width:100%;border:0;border-radius:6px;padding:9px 10px;font-weight:900;margin-top:8px;background:#0f766e;color:white;cursor:pointer}.mark-read:disabled{background:#cbd5e1;color:#64748b;cursor:not-allowed}
.nav-chapter{margin:8px 0 3px;font-size:11px;font-weight:900;color:#334155}.nav-chapter small{float:right;color:#0f766e}
.nav-item{display:flex;align-items:flex-start;gap:6px;padding:4px 5px;border-radius:5px;color:#334155;text-decoration:none;font-size:10px;line-height:1.35}.nav-item:hover{background:#eef6ff}.nav-item.done{color:#94a3b8;text-decoration:line-through}.nav-dot{width:13px;flex:0 0 13px;text-align:center;font-weight:900;color:#94a3b8}.nav-item.done .nav-dot{color:#16a34a}
.main{overflow:auto;min-width:0;padding-bottom:50px}.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px 28px;box-shadow:0 2px 12px rgba(15,23,42,.05)}
.doc-cover{display:flex;align-items:center;gap:14px;padding:4px 0 22px;border-bottom:3px solid #0f766e;margin-bottom:20px}.doc-cover img{width:68px;height:68px;object-fit:contain}.doc-cover h1{font-size:22px;margin:0;color:#0f4c5c}.doc-cover p{margin:4px 0 0;color:#64748b;font-size:12px}
.chapter{margin:26px 0 12px;padding:7px 0;border-bottom:2px solid #0f766e;font-size:19px;color:#064e5a}
.clause{border:1px solid transparent;border-radius:8px;padding:10px 12px 11px;margin:7px 0 12px;transition:.15s}
.clause.done{background:var(--done);border-color:#e2e8f0;color:#64748b}
.clause-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px}.clause-head input{width:17px;height:17px;margin-top:2px;accent-color:#0f766e;cursor:pointer}.clause.done .clause-head input{cursor:default}
.clause-title{font-size:14px;font-weight:900;color:#1e293b;line-height:1.4;flex:1}.clause.done .clause-title{color:#64748b}
.tools{display:flex;gap:5px;flex:0 0 auto}.iconbtn{border:1px solid #cbd5e1;background:#fff;border-radius:5px;padding:3px 6px;font-size:11px;cursor:pointer;font-weight:400}.iconbtn:hover{background:#eff6ff}
.clause-body{font-size:12.5px;line-height:1.65}.clause-body p{text-align:justify;margin:7px 0}.clause-body ul,.clause-body ol{margin:6px 0 8px 22px;padding:0}.clause-body li{margin:3px 0}
.doc-table{width:100%;border-collapse:collapse;margin:9px 0 12px;font-size:11.5px}
.doc-table th,.doc-table td{border:1px solid #cbd5e1;padding:7px 8px;text-align:left;vertical-align:top;line-height:1.45}
.doc-table th{background:#f1f5f9;font-weight:900;color:#1e293b}
.doc-table tr:nth-child(even) td{background:#fafcff}.policy{border-left:4px solid #0ea5e9;background:#f0f9ff;padding:7px 9px;margin:7px 0;border-radius:4px}.benefit{border-left-color:#16a34a;background:#f0fdf4}.safeguard{border-left-color:#f59e0b;background:#fffbeb}
.step{display:flex;gap:8px;margin:6px 0;padding:7px 9px;background:#f8fafc;border-radius:5px}.step b{color:#0f766e}
.preface{font-size:12.5px;line-height:1.65;margin:8px 0;text-align:justify}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal-bg.open{display:flex}.modal{width:min(900px,96vw);max-height:88vh;overflow:auto;background:white;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modal-head{position:sticky;top:0;background:#0f172a;color:white;padding:12px 15px;display:flex;gap:10px;align-items:center}.modal-head h3{margin:0;font-size:15px;flex:1}.modal-head button{border:0;background:white;border-radius:5px;padding:5px 9px;cursor:pointer}.modal-body{padding:16px;font-size:12.5px;line-height:1.65}.modal-body h4{margin:14px 0 6px}.refbox{background:#f8fafc;border-left:4px solid #2563eb;padding:10px;border-radius:5px;margin-bottom:10px;white-space:pre-wrap}.zhbox{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:13px;line-height:1.75;white-space:pre-wrap}.official-links a{display:inline-block;margin:4px 6px 0 0;padding:6px 8px;background:#eff6ff;border-radius:5px;color:#1d4ed8;text-decoration:none;font-weight:700}
.ackbox{margin-top:10px;padding:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px;font-size:11px;line-height:1.5}.ackbox textarea{width:100%;min-height:100px;margin:7px 0;border:1px solid #cbd5e1;border-radius:5px;padding:7px;background:#fff}.ackbox input[type=text]{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:5px;margin:7px 0}.ackbox button{border:0;background:#0f766e;color:#fff;border-radius:5px;padding:8px 10px;font-weight:800;cursor:pointer}
.notice{font-size:10px;color:#64748b}
.top-ref-btn{font-weight:400!important}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}.sidebar{height:auto}.nav-card{max-height:420px}.main{overflow:visible}.top{height:auto;flex-wrap:wrap}.layout{height:auto}.brandbox{min-width:260px}}
@page{size:A4;margin:14mm 12mm 16mm 12mm;@bottom-right{content:counter(page) '/' counter(pages);font-family:Arial,sans-serif;font-size:9pt;color:#475569}}@media print{.top,.sidebar,.tools,.clause-head input,.no-print{display:none!important}.layout{display:block;height:auto;padding:0}.main{overflow:visible}.doc{border:0;box-shadow:none;padding:0}.clause{break-inside:avoid}.chapter{break-after:avoid}.clause.done{background:#fff;color:#111}.clause.done .clause-title{color:#111}}
/* CMS: phones (CLC 7 Nov 2026) - nothing wider than the screen */
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.sidebar,.main,.card,.doc{min-width:0;max-width:100%}}
@media(max-width:600px){.layout{padding:8px;gap:8px}.brandbox{min-width:0;flex:1 1 100%}.brandname{white-space:normal}.doc{padding:14px 12px}.doc-table{display:block;overflow-x:auto}.clause{padding:8px 6px}.top{gap:6px}.top button,.top a{padding:7px 9px;font-size:13px}.modal-bg{padding:6px}}
</style>

function baseHeaders(){var h={'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'X-Client-Info':'CMS-HANDBOOK/'+PORTAL_UVN};if(SESSION&&SESSION.access_token)h.Authorization='Bearer '+SESSION.access_token;return h}
async function api(path,opts,retry){opts=opts||{};opts.headers=Object.assign({},opts.headers||{},baseHeaders());var r=await fetch(SUPABASE_URL+path,opts);if(r.status===401&&SESSION&&SESSION.refresh_token&&!retry){await refreshSession();return api(path,opts,true)}var txt=await r.text(),b=null;try{b=txt?JSON.parse(txt):null}catch(e){}if(!r.ok)throw new Error((b&&(b.message||b.msg||b.error_description||b.hint))||('HTTP '+r.status));return b}
async function rpc(n,a){return api('/rest/v1/rpc/'+n,{method:'POST',body:JSON.stringify(a||{})})}
async function refreshSession(){var fresh=readSession();if(fresh&&fresh.access_token&&SESSION&&fresh.access_token!==SESSION.access_token){SESSION=fresh;return}   // the CMS already refreshed it
var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify({refresh_token:SESSION.refresh_token})});var b=await r.json();if(!r.ok)throw new Error('Session expired');SESSION=b;storeSession()}

function fmt(v){if(!v)return '—';try{return new Date(v).toLocaleString('en-MY')}catch(e){return v}}
function chapterCode(s){
 var m=String(s||'').match(/^([AB])\./i);if(m)return m[1].toUpperCase();
 m=String(s||'').match(/^(\d{1,2})\./);if(m)return m[1];
 m=String(s||'').match(/^APPENDIX\s+([A-E])/i);if(m)return 'APP-'+m[1].toUpperCase();
 m=String(s||'').match(/^附录\s*([A-E])/i);if(m)return 'APP-'+m[1].toUpperCase();
 return 'DOC-'+Math.random().toString(36).slice(2,7);
}
function isLegalText(t){
 return /^(LEGAL REFERENCE|SAFEGUARDING REFERENCE|CHILD-SAFE EVENT REFERENCE|EVENT CONTROL REFERENCE)\s*\|/i.test(String(t||'').trim());
}
function isLegalBlock(b){return b&&b.type==='paragraph'&&isLegalText(b.text)}
function splitTableLegalRows(b){
 var legal=[],rows=[];
 (b.rows||[]).forEach(function(r){
   var joined=(r||[]).map(function(x){return String(x||'')}).join(' | ').trim();
   if(isLegalText(joined))legal.push(joined);else rows.push(r);
 });
 return {legal:legal,rows:rows};
}
function structuredToDoc(raw){
 var d=raw&&raw.document?raw.document:raw;
 if(!d||!Array.isArray(d.blocks))throw new Error('Structured handbook source is unavailable.');
 var out={prefaceBlocks:[],chapters:[]},current=null,clause=null;
 d.blocks.forEach(function(b){
   if(b.type==='heading1'){
     current={code:chapterCode(b.text),title:b.text,clauses:[],prefaceBlocks:[]};
     out.chapters.push(current);clause=null;return;
   }
   if(b.type==='clause_heading'){
     if(!current){
       current={code:chapterCode(b.chapter||'Document'),title:b.chapter||'Document',clauses:[],prefaceBlocks:[]};
       out.chapters.push(current);
     }
     clause={id:b.clause_id,key:b.clause_number,title:b.text,contentBlocks:[],legalRefs:[]};
     current.clauses.push(clause);return;
   }
   if(clause&&b.clause_id===clause.id){
     if(isLegalBlock(b)){clause.legalRefs.push(String(b.text||''));return}
     if(b.type==='table'){
       var parts=splitTableLegalRows(b);
       parts.legal.forEach(function(x){clause.legalRefs.push(x)});
       if(parts.rows.length)clause.contentBlocks.push(Object.assign({},b,{rows:parts.rows}));
       return;
     }
     clause.contentBlocks.push(b);
     return;
   }
   clause=null;
   if(current)current.prefaceBlocks.push(b);else out.prefaceBlocks.push(b);
 });
 return out;
}
function cellHtml(v){return esc(v).replace(/\n/g,'<br>')}
function blockHtml(blocks){
 var out='',listType=null,list=[];
 function flush(){
   if(!list.length)return;
   var tag=listType==='numbered'?'ol':'ul';
   out+='<'+tag+'>'+list.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</'+tag+'>';
   list=[];listType=null;
 }
 (blocks||[]).forEach(function(b){
   if(b.type==='bullet'||b.type==='numbered'){
     if(listType&&listType!==b.type)flush();
     listType=b.type;list.push(b.text||'');return;
   }
   flush();
   if(b.type==='paragraph'){
     var t=String(b.text||''),cls='';
     if(/^COMPANY POLICY\s*\|/i.test(t))cls='policy';
     else if(/^COMPANY BENEFIT\s*\|/i.test(t))cls='policy benefit';
     else if(/^SAFEGUARDING REFERENCE\s*\|/i.test(t))cls='policy safeguard';
     out+='<p'+(cls?' class="'+cls+'"':'')+'>'+esc(t).replace(/\n/g,'<br>')+'</p>';
   }else if(b.type==='table'){
     var rows=Array.isArray(b.rows)?b.rows:[];
     out+='<div style="overflow:auto"><table class="doc-table">';
     rows.forEach(function(row,ri){
       out+='<tr>';
       (row||[]).forEach(function(cell){
         var tag=ri===0&&rows.length>1?'th':'td';
         out+='<'+tag+'>'+cellHtml(cell)+'</'+tag+'>';
       });
       out+='</tr>';
     });
     out+='</table></div>';
   }
 });
 flush();return out;
}
function plainClause(c){
 var parts=[c.title].concat(c.legalRefs||[]);
 (c.contentBlocks||[]).forEach(function(b){
   if(b.type==='table'){
     (b.rows||[]).forEach(function(r){parts.push((r||[]).join(' | '))});
   }else if(b.text)parts.push(b.text);
 });
 return parts.join('\n');
}

 return arr;

var APP_SIG={strokes:[],current:null,drawing:false};
function initAppendixSignature(){
 var cv=document.getElementById('appendixSignature');if(!cv)return;
 APP_SIG={strokes:[],current:null,drawing:false};
 var ctx=cv.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#111827';
 function point(ev){var r=cv.getBoundingClientRect(),t=ev.touches?ev.touches[0]:ev;return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height}}
 function start(ev){ev.preventDefault();APP_SIG.drawing=true;APP_SIG.current=[point(ev)];APP_SIG.strokes.push(APP_SIG.current);ctx.beginPath();ctx.moveTo(APP_SIG.current[0].x,APP_SIG.current[0].y)}
 function move(ev){if(!APP_SIG.drawing)return;ev.preventDefault();var p=point(ev);APP_SIG.current.push(p);ctx.lineTo(p.x,p.y);ctx.stroke()}
 function end(){APP_SIG.drawing=false;APP_SIG.current=null}
 cv.onpointerdown=function(ev){cv.setPointerCapture(ev.pointerId);start(ev)};
 cv.onpointermove=move;cv.onpointerup=end;cv.onpointercancel=end;
}

function horizontalSigningTableBlocks(blocks,kind){
 var a=HB&&HB.assignment||{},e=HB&&HB.employee||{},ack=!!a.safeguarding_acknowledged_at,signed=!!a.appendix_b_signed_at;
 return (blocks||[]).map(function(b){
  if(b.type!=='table'||!Array.isArray(b.rows)||b.rows.length<2)return b;
  var header=b.rows[0].map(function(x){return String(x||'').trim().toLowerCase()});
  if(!header.includes('signature')||!header.includes('date')||!(header.includes('name')||header.includes('employee name')))return b;
  var rows=b.rows.map(function(r){return r.slice()});
  rows[1]=header.map(function(k,i){
   if(k==='name'||k==='employee name')return kind==='A3'&&!ack?{html:'<input id="a3Name" autocomplete="off" aria-label="Type registered full name" oninput="syncA3Checkbox()" placeholder="'+esc(e.employee_name||'Full name')+'" style="width:100%;padding:8px">'}:e.employee_name||'Not recorded';
   if(k.includes('employee id')||k.includes('nric'))return e.employee_id||'Not recorded';
   if(k==='legal employer')return companyName(e.company_code);
   if(k==='job title')return e.job_title||'Not recorded';
   if(k==='signature'){
    if(kind==='A3')return ack?'Typed-name acknowledgement confirmed and locked':{html:'<label><input type="checkbox" id="a3Agree" disabled> I acknowledge the A.3 Undertaking</label><p><button type="button" onclick="submitA3()">Confirm A.3</button></p>'};

   }
   if(k==='date')return kind==='A3'?(ack?fmt(a.safeguarding_acknowledged_at):'Pending confirmation'):(signed?fmt(a.appendix_b_signed_at):'Pending signature');
   return rows[1]&&rows[1][i]||'';
  });
  return Object.assign({},b,{rows:rows});
 });
}

function renderNav(){

function renderDeadlineStatus(){
 var el=document.getElementById('deadlinePanel');if(!el||!HB)return;
 var h=HB.handbook||{},a=HB.assignment;
 if(!a){el.classList.add('hidden');return}
 el.classList.remove('hidden');
 if(h.deadline_enabled===false||!a.due_at){
   el.innerHTML='<b>Reading Deadline:</b> Disabled<br><span class="meta-row">No expiry countdown applies to this assignment.</span>';
   if(DEADLINE_TIMER){clearInterval(DEADLINE_TIMER);DEADLINE_TIMER=null}
   return;
 }
 var due=new Date(a.due_at),assigned=a.assigned_at?new Date(a.assigned_at):null,now=new Date(),ms=due-now;
 var overdue=ms<=0;
 var abs=Math.max(0,ms),days=Math.floor(abs/86400000),hours=Math.floor((abs%86400000)/3600000),mins=Math.floor((abs%3600000)/60000);
 var remain=overdue?'Deadline Passed':(days+' day'+(days===1?'':'s')+' '+hours+' hr '+mins+' min remaining');
 var deemed=[];
 if(a.deemed_received_at)deemed.push('Deemed Received: '+fmt(a.deemed_received_at));
 if(a.deemed_read_at)deemed.push('Deemed Read: '+fmt(a.deemed_read_at));
 el.innerHTML='<b>Assigned (Day 0):</b> '+(assigned?fmt(assigned):'—')+'<br>'+
   '<b>Deadline:</b> '+fmt(a.due_at)+'<br>'+
   '<b style="color:'+(overdue?'#b42318':'#0f766e')+'">'+remain+'</b>'+
   (deemed.length?'<br><span class="meta-row">'+deemed.join('<br>')+'</span>':'');
 if(!DEADLINE_TIMER)DEADLINE_TIMER=setInterval(renderDeadlineStatus,60000);
}
function renderProgress(){
 var total=Number(PROGRESS.required_clause_count||HB.handbook.required_clause_count||217),count=Number(PROGRESS.checked_count||0),pct=Number(PROGRESS.progress_percent||0),threshold=Number(PROGRESS.effective_threshold_percent||(HB.assignment&&HB.assignment.effective_read_threshold_percent)||HB.handbook.default_read_threshold_percent||90),need=Math.ceil(total*threshold/100);
 document.getElementById('progressPct').textContent=pct.toFixed(1)+'%';
 document.getElementById('progressFill').style.width=Math.min(100,pct)+'%';
 document.getElementById('progressText').innerHTML='<b>'+count+'</b> of <b>'+total+'</b> clauses individually confirmed.<br>Minimum for Mark as Read: <b>'+need+'</b> clauses ('+threshold.toFixed(0)+'%).';
 renderDeadlineStatus();
 var btn=document.getElementById('markReadBtn'),a=HB.assignment,ack=document.getElementById('ackPanel');
 if(!a){btn.classList.add('hidden');ack.classList.add('hidden');return}

 if(a.status==='acknowledged'){
   btn.disabled=true;btn.textContent='Handbook Read ✓';
   ack.classList.remove('hidden');
   ack.innerHTML='<b>✓ Signed handbook acknowledgement completed</b><div class="meta-row">'+fmt(a.receipt_acknowledged_at||a.acknowledged_at)+'</div>';
   return;
 }

 var receiptDone=!!a.receipt_acknowledged_at;
 var thresholdDone=count>=need || !!a.deemed_read_at;
 if(a.read_at||a.deemed_read_at){btn.disabled=true;btn.textContent='Handbook Read ✓'}
 else{
   btn.disabled=!(receiptDone&&thresholdDone);
   if(!receiptDone)btn.textContent='Sign Receipt Before Mark as Read';
   else if(!thresholdDone)btn.textContent='Confirm '+Math.max(0,need-count)+' more clauses';
   else btn.textContent='Mark Handbook as Read';
 }

 ack.classList.remove('hidden');
 if(!receiptDone){
   ack.innerHTML='<b>Step 1 — Signed Handbook Receipt</b>'+
     '<div class="meta-row">Sign to confirm receipt of this assigned handbook. This signature does not itself mean you have completed reading or final acknowledgement.</div>'+
     '<input type="text" id="receiptName" placeholder="'+esc(HB.employee.employee_name||'')+'" autocomplete="off">'+
     '<div class="sig-pad"><canvas id="signatureCanvas" width="800" height="220" aria-label="Draw signature"></canvas></div>'+
     '<div class="sig-tools"><button type="button" onclick="clearSignature()">Clear Signature</button><span id="sigState">Draw your signature above.</span></div>'+
     '<button onclick="signReceipt()">Sign Receipt</button>';
   setTimeout(initSignaturePad,0);
   return;
 }

 if(!a.read_at&&!a.deemed_read_at){
   ack.innerHTML='<b>✓ Step 1 completed — Receipt signed</b><div class="meta-row">'+fmt(a.receipt_acknowledged_at)+'</div>'+
     '<div class="notice" style="margin-top:8px">Complete the required clause confirmations, then use <b>Mark Handbook as Read</b>.</div>';
   return;
 }

 ack.innerHTML='<b>Step 3 — Employee Handbook Acknowledgement & Undertaking</b>'+
   '<textarea readonly>'+esc(HB.handbook.acknowledgement_text||'')+'</textarea>'+
   '<label><input type="checkbox" id="ackCheck"> I have read and understand the acknowledgement above.</label>'+
   '<input type="text" id="typedName" placeholder="'+esc(HB.employee.employee_name||'')+'" autocomplete="off">'+
   '<div class="meta-row">Your previously captured drawn signature will remain linked to this handbook receipt and authenticated account.</div>'+
   '<button onclick="acknowledge()">Finalise Acknowledgement '+esc(HB.handbook.version)+'</button>';
}
async function confirmClause(el,key){
 if(!el.checked)return;
 el.disabled=true;
 try{
   var res;
   try{
     res=await rpc('handbook_set_clause_progress',{p_clause_key:key,p_checked:true});
   }catch(firstError){
     if(!String(firstError.message||'').includes('No handbook assignment is linked')||!SESSION||!SESSION.refresh_token)throw firstError;
     var expected=HB&&HB.assignment&&HB.assignment.id;
     if(!expected)throw firstError;
     await refreshSession();
     var verified=await rpc('handbook_my_assignment',{});
     if(!verified||!verified.assignment||verified.assignment.id!==expected)throw new Error('The active sign-in no longer matches the handbook assignment loaded on this page. Please sign out and sign in with the assigned employee account. No reading progress was changed.');
     res=await rpc('handbook_set_clause_progress',{p_clause_key:key,p_checked:true});
   }
   CHECKED.add(key);PROGRESS=res||PROGRESS;
   var sec=document.querySelector('[data-key="'+CSS.escape(key)+'"]');if(sec)sec.classList.add('done');
   renderProgress();renderNav();
 }catch(e){
   el.checked=false;el.disabled=false;
   alert(e.message||'Clause confirmation failed. No progress was recorded.');
 }
}

var SIGNATURE={strokes:[],drawing:false,current:null};
function initSignaturePad(){
 var cv=document.getElementById('signatureCanvas');if(!cv)return;
 SIGNATURE={strokes:[],drawing:false,current:null};
 var ctx=cv.getContext('2d');ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111827';
 function pt(e){
  var r=cv.getBoundingClientRect(),src=e.touches?e.touches[0]:e;
  return {x:(src.clientX-r.left)*(cv.width/r.width),y:(src.clientY-r.top)*(cv.height/r.height),t:Date.now()};
 }
 function start(e){e.preventDefault();SIGNATURE.drawing=true;SIGNATURE.current=[];SIGNATURE.strokes.push(SIGNATURE.current);var p=pt(e);SIGNATURE.current.push(p);ctx.beginPath();ctx.moveTo(p.x,p.y)}
 function move(e){if(!SIGNATURE.drawing)return;e.preventDefault();var p=pt(e);SIGNATURE.current.push(p);ctx.lineTo(p.x,p.y);ctx.stroke()}
 function end(e){if(!SIGNATURE.drawing)return;if(e)e.preventDefault();SIGNATURE.drawing=false;SIGNATURE.current=null;var s=document.getElementById('sigState');if(s)s.textContent=SIGNATURE.strokes.some(function(x){return x.length>1})?'Signature captured.':'Draw your signature above.'}
 cv.onmousedown=start;cv.onmousemove=move;window.addEventListener('mouseup',end);
 cv.ontouchstart=start;cv.ontouchmove=move;cv.ontouchend=end;
}
function clearSignature(){
 var cv=document.getElementById('signatureCanvas');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
 SIGNATURE={strokes:[],drawing:false,current:null};
 var s=document.getElementById('sigState');if(s)s.textContent='Draw your signature above.';
}
function signaturePayload(){
 return {version:1,canvas:{width:800,height:220},strokes:SIGNATURE.strokes.filter(function(x){return x.length>1})};
}
async function signReceipt(){
 var nm=document.getElementById('receiptName');
 if(!nm||!nm.value.trim()){alert('Please type your full name exactly as shown in your employee record.');return}

 if(!confirm('Submit your signed handbook receipt?'))return;
 try{
   HB=await rpc('handbook_acknowledge_receipt',{p_typed_name:nm.value.trim(),p_signature:sig});
   renderMeta();renderProgress();

}

function openClauseSearch(){
 if(!DOC_EN||!Array.isArray(DOC_EN.chapters)){alert('Handbook is still loading. Please try again.');return}
 var html='<div style="display:flex;gap:8px;margin-bottom:10px">'+
   '<input id="clauseSearchInput" type="search" placeholder="Search clause number or title" '+
   'style="flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px" '+

function runClauseSearch(q){
 var box=document.getElementById('clauseSearchResults');if(!box)return;
 q=String(q||'').trim().toLowerCase();
 if(!q){box.innerHTML='Type a clause number, keyword or title.';return}
 var results=[];
 DOC_EN.chapters.forEach(function(ch){
   ch.clauses.forEach(function(cl){
     var hay=(String(cl.id||'')+' '+String(cl.key||'')+' '+String(cl.title||'')+' '+plainClause(cl)).toLowerCase();
     if(hay.indexOf(q)>=0)results.push({ch:ch,cl:cl});
   });
 });
 if(!results.length){box.innerHTML='<div class="notice">No matching clauses found.</div>';return}
 box.innerHTML=results.slice(0,50).map(function(x){
   var pk=progressKey(x.ch,x.cl);
   return '<button type="button" onclick="jumpToClause(\''+jsq(pk)+'\')" '+
     'style="display:block;width:100%;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:6px;padding:8px 9px;margin:5px 0;cursor:pointer;font-weight:400">'+
     '<b style="font-weight:600">'+esc(x.cl.id||x.cl.key||'')+'</b> · '+esc(x.cl.title||'')+'</button>';
 }).join('');
}
